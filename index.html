<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vintage Jam — Vintage & Antique Collection</title>

    <meta 
        name="description"
        content="Vintage Jam — каталог винтажних та антикварних предметів."
    >

    <link rel="stylesheet" href="assets/css/style.css">
</head>


<body>


<header class="header">

    <div class="logo">
        Vintage Jam
    </div>


    <div class="header-actions">

        <button id="languageSwitcher">
            UA
        </button>

    </div>

</header>



<main>


<section class="search-section">

    <input 
        id="searchInput"
        type="search"
        placeholder="Пошук..."
    >

</section>




<section class="categories-section">

    <h2>
        Категорії
    </h2>


    <div 
        id="categories"
        class="categories-list">
    </div>

</section>





<section class="new-arrivals-section">

    <h2>
        Нові надходження
    </h2>


    <div 
        id="newArrivals"
        class="products-grid">
    </div>


</section>






<section class="catalog-section">

    <h2>
        Каталог
    </h2>


    <div 
        id="catalog"
        class="products-grid">
    </div>


</section>




<section class="sold-section">

    <h2>
        Продано
    </h2>


    <div 
        id="soldProducts"
        class="products-grid">
    </div>


</section>


</main>






<nav class="mobile-navigation">


<button>
    🏠
    <span>
        Каталог
    </span>
</button>


<button>
    🔍
    <span>
        Пошук
    </span>
</button>


<button>
    ☰
    <span>
        Меню
    </span>
</button>


</nav>





<script type="module" src="assets/js/app.js"></script>


</body>

</html>
