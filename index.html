<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vintage Jam — Vintage & Antique Collection</title>
    <meta name="description" content="Vintage Jam — каталог вінтажних та антикварних предметів.">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/payment-methods.css">
</head>
<body>
<header class="header">
    <a class="logo" href="index.html" aria-label="Vintage Jam — каталог">Vintage Jam</a>
    <div class="header-actions">
        <button id="languageSwitcher" type="button" aria-label="Переключити мову">UA</button>
    </div>
</header>

<main id="mainContent">
    <section class="search-section" id="searchSection">
        <input id="searchInput" type="search" placeholder="Пошук..." aria-label="Пошук товарів" autocomplete="off" enterkeyhint="search">
    </section>

    <section class="sort-section">
        <select id="sortSelect" aria-label="Сортування">
            <option value="new">Нові спочатку</option>
            <option value="old">Старі спочатку</option>
            <option value="price_up">Ціна: від нижчої</option>
            <option value="price_down">Ціна: від вищої</option>
        </select>
    </section>

    <section class="categories-section" id="categoriesSection">
        <h2 id="categoriesHeading">Категорії</h2>
        <div id="categories" class="categories-list"></div>
    </section>

    <section class="new-arrivals-section" id="newArrivalsSection">
        <h2 id="newArrivalsHeading">Нові надходження</h2>
        <div id="newArrivals" class="products-grid"></div>
    </section>

    <section class="catalog-section" id="catalogSection">
        <h2 id="catalogHeading">Каталог</h2>
        <div id="catalog" class="products-grid"></div>
    </section>

    <section class="sold-section" id="soldSection">
        <h2 id="soldHeading">Продано</h2>
        <div id="soldProducts" class="products-grid"></div>
    </section>

    <section class="payment-section" data-payment-section hidden>
        <h2 data-payment-title>Способи оплати</h2>
        <p class="payment-section-description" data-payment-description></p>
        <div class="payment-methods" data-payment-list></div>
        <p class="payment-note" data-payment-note></p>
    </section>
</main>

<nav class="mobile-navigation" aria-label="Мобільна навігація">
    <button id="mobileCatalogButton" type="button" aria-label="Перейти до каталогу">
        <span aria-hidden="true">🏠</span>
        <span id="mobileCatalogLabel">Каталог</span>
    </button>
    <button id="mobileSearchButton" type="button" aria-label="Відкрити пошук">
        <span aria-hidden="true">🔍</span>
        <span id="mobileSearchLabel">Пошук</span>
    </button>
    <a id="mobileContactButton" href="tel:+380983219801" aria-label="Зв’язатися з Vintage Jam">
        <span aria-hidden="true">💬</span>
        <span id="mobileContactLabel">Зв’язок</span>
    </a>
</nav>

<script type="module" src="assets/js/app.js"></script>
<script type="module" src="assets/js/payment-methods.js"></script>
</body>
</html>
