<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Vintage Jam — картка вінтажного товару">
<title>Vintage Jam — Товар</title>
<link rel="stylesheet" href="assets/css/style.css?v=1.2.6">
<link rel="stylesheet" href="assets/css/gallery-enhancements.css?v=1.2.6">
<link rel="stylesheet" href="assets/css/gallery-lightbox.css?v=1.2.6">
<link rel="stylesheet" href="assets/css/contact-actions.css?v=1.2.6">
<link rel="stylesheet" href="assets/css/payment-methods.css?v=1.2.6">
<link rel="stylesheet" href="assets/css/shipping-info.css?v=1.2.6">
</head>
<body>
<header class="header"><a class="logo" href="index.html">Vintage Jam</a><div class="header-actions"><button id="languageSwitcher" type="button">UA</button></div></header>
<main id="productPage" class="product-page" hidden>
<a class="product-back" href="index.html" id="backLink">← До каталогу</a>
<div class="product-layout">
<section class="product-gallery"><div class="product-main-image-wrap"><img id="mainProductImage" class="product-main-image" src="assets/images/no-image.webp" alt=""><span id="productStatus" class="product-status" hidden></span><button id="galleryPrevious" class="gallery-arrow previous" type="button">‹</button><button id="galleryNext" class="gallery-arrow next" type="button">›</button><span id="galleryCounter" class="gallery-counter"></span></div><div id="galleryThumbnails" class="gallery-thumbnails"></div></section>
<section class="product-summary"><p id="productCategory" class="product-category"></p><h1 id="productTitle"></h1><p id="productShortDescription" class="product-lead"></p><div id="productPrice" class="product-page-price"></div><div id="productMedia" class="product-media"></div><a id="contactButton" class="contact-button product-contact-button" href="tel:+380983219801">💬 <span id="contactButtonText">Зв’язатися</span></a></section>
</div>
<section class="product-content-card"><h2 id="descriptionHeading">Опис</h2><p id="productDescription"></p></section>
<section id="attributesSection" class="product-content-card"><h2 id="attributesHeading">Характеристики</h2><dl id="attributes" class="attributes-list"></dl></section>
<section id="storySection" class="product-content-card" hidden><h2 id="storyHeading">Історія предмета</h2><p id="productStory"></p></section>
<section class="shipping-section" data-shipping-section hidden><h2 data-shipping-title>Доставка та умови покупки</h2><p class="shipping-intro" data-shipping-intro></p><div class="shipping-grid"><article class="shipping-card"><span class="shipping-icon">📍</span><div><h3 data-shipping-location-title></h3><p data-shipping-location-text></p></div></article><article class="shipping-card"><span class="shipping-icon">🚚</span><div><h3 data-shipping-carriers-title></h3><p data-shipping-carriers-text></p></div></article><article class="shipping-card"><span class="shipping-icon">🧾</span><div><h3 data-shipping-calculation-title></h3><p data-shipping-calculation-text></p></div></article><article class="shipping-card"><span class="shipping-icon">📦</span><div><h3 data-shipping-packing-title></h3><p data-shipping-packing-text></p></div></article><article class="shipping-card"><span class="shipping-icon">📷</span><div><h3 data-shipping-photo-title></h3><p data-shipping-photo-text></p></div></article></div><p class="shipping-note" data-shipping-note></p></section>
<section class="payment-section" data-payment-section hidden><h2 data-payment-title>Способи оплати</h2><p class="payment-section-description" data-payment-description></p><div class="payment-methods" data-payment-list></div><p class="payment-note" data-payment-note></p></section>
</main>
<main id="productState" class="product-state"><p id="productStateMessage">Завантаження товару…</p><a id="stateBackLink" href="index.html">Повернутися до каталогу</a></main>
<nav class="mobile-navigation"><a href="index.html">🏠<span id="mobileCatalogText">Каталог</span></a><a href="index.html#searchInput">🔍<span id="mobileSearchText">Пошук</span></a></nav>
<script src="data/catalog-fallback.js?v=1.2.6"></script>
<script src="assets/js/item-fast.js?v=1.2.6"></script>
<script type="module" src="assets/js/shipping-info.js?v=1.2.6"></script>
<script type="module" src="assets/js/payment-methods.js?v=1.2.6"></script>
</body>
</html>
