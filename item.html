<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Vintage Jam — картка вінтажного товару">
    <title>Vintage Jam — Товар</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gallery-enhancements.css">
    <link rel="stylesheet" href="assets/css/gallery-lightbox.css">
    <link rel="stylesheet" href="assets/css/contact-actions.css">
    <link rel="stylesheet" href="assets/css/payment-methods.css">
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html" aria-label="Vintage Jam — каталог">Vintage Jam</a>
        <div class="header-actions">
            <button id="languageSwitcher" type="button" aria-label="Change language">UA</button>
        </div>
    </header>

    <main id="productPage" class="product-page" hidden>
        <a class="product-back" href="index.html" id="backLink">← До каталогу</a>

        <div class="product-layout">
            <section class="product-gallery" aria-label="Галерея товару">
                <div class="product-main-image-wrap">
                    <img id="mainProductImage" class="product-main-image" src="assets/images/no-image.webp" alt="" decoding="async">
                    <span id="productStatus" class="product-status" hidden></span>
                    <button id="galleryPrevious" class="gallery-arrow previous" type="button" aria-label="Попереднє зображення">‹</button>
                    <button id="galleryNext" class="gallery-arrow next" type="button" aria-label="Наступне зображення">›</button>
                    <span id="galleryCounter" class="gallery-counter" aria-live="polite"></span>
                </div>
                <div id="galleryThumbnails" class="gallery-thumbnails" aria-label="Мініатюри зображень"></div>
            </section>

            <section class="product-summary">
                <p id="productCategory" class="product-category"></p>
                <h1 id="productTitle"></h1>
                <p id="productShortDescription" class="product-lead"></p>
                <div id="productPrice" class="product-page-price"></div>

                <div id="productMedia" class="product-media"></div>

                <a id="contactButton" class="contact-button product-contact-button">
                    💬 <span id="contactButtonText">Зв’язатися</span>
                </a>
            </section>
        </div>

        <section class="product-content-card">
            <h2 id="descriptionHeading">Опис</h2>
            <p id="productDescription"></p>
        </section>

        <section id="attributesSection" class="product-content-card">
            <h2 id="attributesHeading">Характеристики</h2>
            <dl id="attributes" class="attributes-list"></dl>
        </section>

        <section id="storySection" class="product-content-card" hidden>
            <h2 id="storyHeading">Історія предмета</h2>
            <p id="productStory"></p>
        </section>

        <section class="payment-section" data-payment-section hidden>
            <h2 data-payment-title>Способи оплати</h2>
            <p class="payment-section-description" data-payment-description></p>
            <div class="payment-methods" data-payment-list></div>
            <p class="payment-note" data-payment-note></p>
        </section>
    </main>

    <main id="productState" class="product-state" aria-live="polite">
        <p id="productStateMessage">Завантаження товару…</p>
        <a id="stateBackLink" href="index.html">Повернутися до каталогу</a>
    </main>

    <nav class="mobile-navigation" aria-label="Основна навігація">
        <a href="index.html">🏠<span id="mobileCatalogText">Каталог</span></a>
        <a href="index.html#searchInput">🔍<span id="mobileSearchText">Пошук</span></a>
    </nav>

    <div id="productLightbox" class="product-lightbox" role="dialog" aria-modal="true" aria-label="Повноекранна галерея" hidden>
        <div id="lightboxStage" class="lightbox-stage">
            <img id="lightboxImage" class="lightbox-image" src="assets/images/no-image.webp" alt="" decoding="async">
        </div>
        <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Закрити галерею">×</button>
        <button id="lightboxPrevious" class="lightbox-arrow previous" type="button" aria-label="Попереднє зображення">‹</button>
        <button id="lightboxNext" class="lightbox-arrow next" type="button" aria-label="Наступне зображення">›</button>
        <span id="lightboxCounter" class="lightbox-counter" aria-live="polite"></span>
    </div>

    <div id="contactSheet" class="contact-sheet" role="dialog" aria-modal="true" aria-labelledby="contactSheetTitle" hidden>
        <button id="contactSheetBackdrop" class="contact-sheet-backdrop" type="button" aria-label="Закрити"></button>
        <section class="contact-sheet-panel">
            <button id="contactSheetClose" class="contact-sheet-close" type="button" aria-label="Закрити">×</button>
            <header class="contact-sheet-header">
                <h2 id="contactSheetTitle">Зв’язатися щодо товару</h2>
                <p id="contactSheetSubtitle">Оберіть зручний спосіб зв’язку</p>
            </header>

            <div id="contactMethods" class="contact-methods">
                <a id="contactTelegram" class="contact-method" target="_blank" rel="noopener noreferrer" hidden><span class="contact-method-icon">✈️</span><span id="contactTelegramText">Telegram</span></a>
                <a id="contactViber" class="contact-method" target="_blank" rel="noopener noreferrer" hidden><span class="contact-method-icon">📞</span><span id="contactViberText">Viber</span></a>
                <a id="contactWhatsapp" class="contact-method" target="_blank" rel="noopener noreferrer" hidden><span class="contact-method-icon">💬</span><span id="contactWhatsappText">WhatsApp</span></a>
                <a id="contactPhone" class="contact-method" hidden><span class="contact-method-icon">☎️</span><span id="contactPhoneText">Зателефонувати</span></a>
                <a id="contactEmail" class="contact-method" hidden><span class="contact-method-icon">✉️</span><span id="contactEmailText">Email</span></a>
            </div>

            <div class="contact-secondary-actions">
                <button id="shareProduct" class="contact-secondary-action" type="button"><span id="shareProductText">Поділитися товаром</span></button>
                <button id="copyProductLink" class="contact-secondary-action secondary" type="button"><span id="copyProductLinkText">Скопіювати посилання</span></button>
            </div>
        </section>
    </div>

    <div id="contactToast" class="contact-toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="assets/js/item.js"></script>
    <script type="module" src="assets/js/gallery-swipe.js"></script>
    <script type="module" src="assets/js/gallery-lightbox.js"></script>
    <script type="module" src="assets/js/contact-actions.js"></script>
    <script type="module" src="assets/js/payment-methods.js"></script>
</body>
</html>
